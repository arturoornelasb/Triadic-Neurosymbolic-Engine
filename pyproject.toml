[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosym"
version = "0.1.0"
description = "A Deterministic Algebraic Framework for Neurosymbolic Validation and Semantic Projection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
authors = [
    { name = "José Arturo Ornelas Brand", email = "arturoornelas62@gmail.com" }
]
dependencies = [
    "numpy>=1.20",
    "networkx>=2.5",
    "scikit-learn>=1.0",
    "sentence-transformers>=2.2",
    "sympy>=1.12",
    "streamlit>=1.31.0",
    "streamlit-agraph>=0.0.45",
    "pandas>=2.0.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0"
]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "httpx>=0.25.0"
]

[tool.setuptools.packages.find]
where = ["src"]
