[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosym"
version = "0.1.0"
description = "A Deterministic Algebraic Framework for Neurosymbolic Validation and Semantic Projection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-NC-4.0" }
authors = [
    { name = "José Arturo Ornelas Brand" }
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "networkx>=2.5",
    "scikit-learn>=1.0",
    "sentence-transformers>=2.2",
    "sympy>=1.12",
    "streamlit>=1.31.0",
    "streamlit-agraph>=0.0.45",
    "pandas>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
